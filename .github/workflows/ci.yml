# ============================================================
# OpenClaw — GitHub Actions CI/CD 流水线
# ============================================================
# 触发: PR / push 到 main / 手动触发 / 每日定时
# 流程: lint → type-check → test → build-docker → (可选) push
#
# 使用方法:
#   1. 确保仓库已推送到 GitHub
#   2. 在 GitHub 设置 → Secrets 中添加 DOCKER_USERNAME 和 DOCKER_PASSWORD
#   3. 每次 push 到 main 自动触发
# ============================================================

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.png"
      - "**.jpg"
      - "**.svg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      push_image:
        description: "是否推送 Docker 镜像"
        type: boolean
        default: false
  schedule:
    # 每日 02:00 UTC 跑全量测试（捕获依赖更新导致的问题）
    - cron: "0 2 * * *"

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: openclaw

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 代码质量检查 ──
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"

      - name: ruff check
        run: ruff check src/ tests/ cli.py

      - name: ruff format check
        run: ruff format --check src/ tests/ cli.py

      - name: mypy type check
        run: mypy src/ cli.py

  # ── 测试 ──
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"

      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── Docker 构建 ──
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Test Docker image health
        run: |
          # 启动容器并检查健康检查
          docker run -d --name test-api -p 8000:8000 \
            -e LLM_API_KEY=mock \
            -e OPENCLAW_AUTH_MODE=none \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5
          curl -sf http://localhost:8000/health || (docker logs test-api && exit 1)
          docker stop test-api && docker rm test-api

      # ── 可选: 推送到 Docker Hub ──
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && (github.event.inputs.push_image == 'true' || github.event_name == 'push')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && (github.event.inputs.push_image == 'true' || github.event_name == 'push')
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
