# ============================================================
# Prometheus 配置 — OpenClaw 生产监控
# 由 docker-compose.prod.yml 的 prometheus 服务挂载
# ============================================================
global:
  scrape_interval: 15s      # 默认抓取间隔
  evaluation_interval: 15s  # 告警规则评估间隔
  external_labels:
    cluster: "openclaw-prod"

scrape_configs:
  # ── API 服务（/metrics 由 FastAPI 中间件暴露，免认证白名单）──
  - job_name: "openclaw-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "openclaw-api"

  # ── Prometheus 自身健康 ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
