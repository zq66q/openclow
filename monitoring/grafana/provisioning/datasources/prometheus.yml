# ============================================================
# Grafana 自动配置：数据源
# 容器启动时自动注册 Prometheus 数据源，无需手动操作
# ============================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
